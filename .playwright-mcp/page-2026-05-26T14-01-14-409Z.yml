            - heading "Enable HTTPS" [level=3] [ref=e211]
            - paragraph [ref=e212]: Install SSL/TLS certificate. Free via Let's Encrypt. Encrypts all data in transit between user and server.
          - generic [ref=e213]:
            - generic [ref=e214]: "02"
            - img [ref=e216]
            - heading "Strong Authentication" [level=3] [ref=e220]
            - paragraph [ref=e221]: Enforce strong passwords, implement 2FA/MFA, use bcrypt for password hashing with salt rounds 12+.
          - generic [ref=e222]:
            - generic [ref=e223]: "03"
            - img [ref=e225]
            - heading "Security Headers" [level=3] [ref=e227]
            - paragraph [ref=e228]: Add CSP, X-Frame-Options, HSTS, X-Content-Type. Prevents XSS, clickjacking, and MIME attacks.
          - generic [ref=e229]:
            - generic [ref=e230]: "04"
            - img [ref=e232]
            - heading "Update Dependencies" [level=3] [ref=e236]
            - paragraph [ref=e237]: Run npm audit weekly. Patch known CVEs immediately. Use Dependabot or Snyk for automated alerts.
          - generic [ref=e238]:
            - generic [ref=e239]: "05"
            - img [ref=e241]
            - heading "Input Validation" [level=3] [ref=e244]
            - paragraph [ref=e245]: Validate and sanitize ALL user input server-side. Use parameterized queries. Never trust client data.
          - generic [ref=e246]:
            - generic [ref=e247]: "06"
            - img [ref=e249]
            - heading "Rate Limiting" [level=3] [ref=e252]
            - paragraph [ref=e253]: Limit login attempts (5/min), API calls (100/min), and form submissions. Blocks brute-force attacks.
          - generic [ref=e254]:
            - generic [ref=e255]: "07"
            - img [ref=e257]
            - heading "Error Handling" [level=3] [ref=e260]
            - paragraph [ref=e261]: Never expose stack traces or DB errors to users. Use generic error pages. Log details server-side only.
