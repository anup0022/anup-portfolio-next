        - heading "8 Essential Fixes for Your Website" [level=2] [ref=e205]
        - paragraph [ref=e206]: These fundamental security measures can prevent 90%+ of common attacks. Most take less than an hour to implement.
      - generic [ref=e207]:
        - generic [ref=e208]:
          - generic [ref=e209]: "01"
          - img [ref=e211]
          - heading "Enable HTTPS" [level=3] [ref=e214]
          - paragraph [ref=e215]: Install SSL/TLS certificate. Free via Let's Encrypt. Encrypts all data in transit between user and server.
        - generic [ref=e216]:
          - generic [ref=e217]: "02"
          - img [ref=e219]
          - heading "Strong Authentication" [level=3] [ref=e223]
          - paragraph [ref=e224]: Enforce strong passwords, implement 2FA/MFA, use bcrypt for password hashing with salt rounds 12+.
        - generic [ref=e225]:
          - generic [ref=e226]: "03"
          - img [ref=e228]
          - heading "Security Headers" [level=3] [ref=e230]
          - paragraph [ref=e231]: Add CSP, X-Frame-Options, HSTS, X-Content-Type. Prevents XSS, clickjacking, and MIME attacks.
        - generic [ref=e232]:
          - generic [ref=e233]: "04"
          - img [ref=e235]
          - heading "Update Dependencies" [level=3] [ref=e239]
          - paragraph [ref=e240]: Run npm audit weekly. Patch known CVEs immediately. Use Dependabot or Snyk for automated alerts.
        - generic [ref=e241]:
          - generic [ref=e242]: "05"
          - img [ref=e244]
          - heading "Input Validation" [level=3] [ref=e247]
          - paragraph [ref=e248]: Validate and sanitize ALL user input server-side. Use parameterized queries. Never trust client data.
        - generic [ref=e249]:
          - generic [ref=e250]: "06"
          - img [ref=e252]
          - heading "Rate Limiting" [level=3] [ref=e255]
          - paragraph [ref=e256]: Limit login attempts (5/min), API calls (100/min), and form submissions. Blocks brute-force attacks.
        - generic [ref=e257]:
          - generic [ref=e258]: "07"
          - img [ref=e260]
          - heading "Error Handling" [level=3] [ref=e263]
          - paragraph [ref=e264]: Never expose stack traces or DB errors to users. Use generic error pages. Log details server-side only.
        - generic [ref=e265]:
          - generic [ref=e266]: "08"
          - img [ref=e268]
          - heading "CORS & Cookies" [level=3] [ref=e270]
          - paragraph [ref=e271]: Set strict CORS origins. Use HttpOnly, Secure, SameSite=Strict on cookies. Prevents CSRF attacks.
